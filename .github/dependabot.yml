version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    groups:
      rust-production:
        dependency-type: production
      rust-development:
        dependency-type: development

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
      day: monday
      time: "13:15"
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:30"
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:45"
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    groups:
      github-actions:
        patterns: ["*"]
