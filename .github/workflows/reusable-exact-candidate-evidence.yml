name: Reusable Exact Candidate Evidence

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Immutable product candidate commit SHA
        required: true
        type: string
      candidate_ref:
        description: Protected source ref recorded when candidate prerequisites ran
        required: true
        type: string
      qualification_tooling_sha:
        description: Immutable release-control tooling commit SHA
        required: true
        type: string
      qualification_tooling_ref:
        description: Protected qualification tooling ref
        required: true
        type: string
      qualification_subject_artifact:
        description: Immutable artifact containing the canonical package and candidate-bound subjects
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  exact-candidate-evidence:
    name: Exact candidate evidence
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact qualification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.qualification_tooling_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned release evidence dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-release.txt
      - name: Verify immutable tooling identity
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $dirty = git status --porcelain --untracked-files=all
          if ($head -ne "${{ inputs.qualification_tooling_sha }}") { throw "qualification tooling checkout mismatch" }
          if ($dirty) { throw "qualification tooling checkout is dirty" }
      - name: Download tested package and qualification subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.qualification_subject_artifact }}
          path: artifacts/release/qualification
      - name: Resolve and verify immutable identities
        id: qualification
        shell: pwsh
        run: |
          $root = "artifacts/release/qualification"
          $inputs = Get-Content "$root/qualification-inputs/qualification-inputs.json" -Raw | ConvertFrom-Json
          if ($inputs.candidate_commit_sha -ne "${{ inputs.candidate_sha }}") { throw "qualification artifact candidate mismatch" }
          if ($inputs.candidate_ref -ne "${{ inputs.candidate_ref }}") { throw "qualification artifact candidate ref mismatch" }
          if ($inputs.qualification_tooling.commit_sha -ne "${{ inputs.qualification_tooling_sha }}") { throw "qualification tooling mismatch" }
          if ($inputs.qualification_tooling.ref -ne "${{ inputs.qualification_tooling_ref }}") { throw "qualification tooling ref mismatch" }
          $inputRoot = Join-Path $root "qualification-inputs"
          $package = (Join-Path $inputRoot $inputs.package_path).Replace('\', '/')
          $supplyRoot = (Join-Path $inputRoot $inputs.artifacts.supply_chain_evidence.artifact_name).Replace('\', '/')
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) { throw "canonical package is missing" }
          if ((Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant() -ne $inputs.package_sha256) { throw "canonical package digest mismatch" }
          "package=$package" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "supply_root=$supplyRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Project already-proven exact-SHA quality gates
        shell: pwsh
        run: |
          python scripts/release_qualification.py project-gate-evidence `
            --repository "${{ github.repository }}" `
            --qualification-inputs artifacts/release/qualification/qualification-inputs/qualification-inputs.json `
            --output-dir artifacts/release/exact-candidate `
            --run-id "${{ github.run_id }}" `
            --attempt "${{ github.run_attempt }}"
      - name: Attest exact package provenance
        id: package-attestation
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: ${{ steps.qualification.outputs.package }}
      - name: Attest assembled-package SBOM
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: ${{ steps.qualification.outputs.package }}
          sbom-path: ${{ steps.qualification.outputs.supply_root }}/aether-package.cdx.json
      - name: Build signed package provenance subject
        shell: pwsh
        run: |
          $inputs = Get-Content artifacts/release/qualification/qualification-inputs/qualification-inputs.json -Raw | ConvertFrom-Json
          python scripts/release_qualification.py build-provenance-subject `
            --repository "${{ github.repository }}" `
            --candidate-repository $inputs.candidate_repository `
            --candidate-sha "${{ inputs.candidate_sha }}" `
            --candidate-tree-sha $inputs.candidate_tree_sha `
            --candidate-ref "${{ inputs.candidate_ref }}" `
            --qualification-tooling-sha "${{ inputs.qualification_tooling_sha }}" `
            --qualification-tooling-tree-sha $inputs.qualification_tooling.tree_sha `
            --qualification-tooling-ref "${{ inputs.qualification_tooling_ref }}" `
            --package "${{ steps.qualification.outputs.package }}" `
            --attestation-bundle "${{ steps.package-attestation.outputs.bundle-path }}" `
            --qualification-inputs artifacts/release/qualification/qualification-inputs/qualification-inputs.json `
            --output artifacts/release/qualification/qualification-subjects/package-provenance.json `
            --run-id "${{ github.run_id }}" `
            --attempt "${{ github.run_attempt }}"
      - name: Assemble immutable two-identity bundle
        shell: pwsh
        run: |
          $package = "${{ steps.qualification.outputs.package }}"
          $packageSha = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          $arguments = @(
            "scripts/release_evidence.py", "assemble",
            "--evidence-dir", "artifacts/release/exact-candidate",
            "--package", $package,
            "--package-attestation-sha256", $packageSha,
            "--sbom", "${{ steps.qualification.outputs.supply_root }}/aether-rust.cdx.json",
            "--sbom", "${{ steps.qualification.outputs.supply_root }}/aether-go.cdx.json",
            "--sbom", "${{ steps.qualification.outputs.supply_root }}/aether-package.cdx.json",
            "--output-dir", "artifacts/release/bundles"
          )
          $subjects = Get-ChildItem artifacts/release/qualification/qualification-subjects -Filter "*.json"
          if ($subjects.Count -ne 18) { throw "expected 18 candidate-bound subjects, found $($subjects.Count)" }
          foreach ($subject in $subjects) { $arguments += @("--subject", "$($subject.BaseName)=$($subject.FullName)") }
          python @arguments
      - name: Upload SHA-named evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aether-release-evidence-${{ inputs.candidate_sha }}-tooling-${{ inputs.qualification_tooling_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/bundles/aether-release-evidence-*.zip
          if-no-files-found: error

  verify-exact-candidate-evidence:
    name: Verify exact candidate evidence
    needs: exact-candidate-evidence
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact qualification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.qualification_tooling_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download exact producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aether-release-evidence-${{ inputs.candidate_sha }}-tooling-${{ inputs.qualification_tooling_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/downloaded
      - name: Verify provenance, source outcomes, package bytes, and tooling identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = Get-ChildItem artifacts/release/downloaded -Recurse -Filter "aether-release-evidence-*.zip" | Select-Object -First 1
          if (-not $bundle) { throw "downloaded evidence bundle is missing" }
          python scripts/verify_release_evidence.py $bundle.FullName `
            --expected-commit-sha "${{ inputs.candidate_sha }}" `
            --expected-ref "${{ inputs.candidate_ref }}" `
            --expected-tooling-sha "${{ inputs.qualification_tooling_sha }}" `
            --expected-tooling-ref "${{ inputs.qualification_tooling_ref }}" `
            --require-official `
            --require-passed `
            --out artifacts/release/verified-verdict.json
      - name: Upload independently verified verdict
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aether-release-evidence-verdict-${{ inputs.candidate_sha }}-tooling-${{ inputs.qualification_tooling_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/verified-verdict.json
          if-no-files-found: error
