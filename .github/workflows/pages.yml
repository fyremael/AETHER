name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.86.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Build Rust API docs
        run: cargo doc --workspace --no-deps

      - name: Assemble Pages site
        run: python scripts/build_pages.py --out-dir _site --candidate-sha "${{ github.sha }}"

      - name: Verify built candidate identity
        run: |
          python scripts/verify_pages_deployment.py \
            --site-file _site/source-version.json \
            --expected-sha "${{ github.sha }}" \
            --out artifacts/pages/build-verification.json

      - name: Upload Pages build verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-build-verification
          path: artifacts/pages/build-verification.json
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed candidate SHA
        id: verify
        continue-on-error: true
        run: |
          python scripts/verify_pages_deployment.py \
            --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/source-version.json" \
            --expected-sha "${{ github.sha }}" \
            --out artifacts/pages/deployment-verification.json

      - name: Upload Pages deployment verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-deployment-verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pages/deployment-verification.json
          if-no-files-found: error

      - name: Enforce deployment and exact SHA
        if: always()
        shell: bash
        run: |
          test "${{ steps.deployment.outcome }}" = "success"
          test "${{ steps.verify.outcome }}" = "success"
