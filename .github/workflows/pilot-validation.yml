name: Pilot Validation

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: pilot-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch-pack:
    name: Launch Validation (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum

      - name: Seed CI host baselines
        shell: pwsh
        run: |
          ./scripts/run-performance-baseline.ps1 -Suite core_kernel -HostManifestPath fixtures/performance/hosts/github-windows-latest.json -OutputPath artifacts/performance/baselines/core_kernel/github-windows-latest.json
          ./scripts/run-performance-baseline.ps1 -Suite service_in_process -HostManifestPath fixtures/performance/hosts/github-windows-latest.json -OutputPath artifacts/performance/baselines/service_in_process/github-windows-latest.json

      - name: Run pilot launch validation
        shell: pwsh
        run: ./scripts/run-pilot-launch-validation.ps1 -HostManifestPath fixtures/performance/hosts/github-windows-latest.json

      - name: Build packaged pilot bundle
        shell: pwsh
        run: ./scripts/build-pilot-package.ps1

      - name: Upload pilot validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-validation-artifacts
          path: |
            artifacts/pilot/reports
            artifacts/performance
            artifacts/pilot/launch
            artifacts/pilot/packages
          if-no-files-found: warn

      - name: Publish workflow summary
        if: always()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Pilot validation artifacts"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- `artifacts/pilot/reports/latest.md`'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- `artifacts/performance/latest.md`'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- `artifacts/performance/latest-drift.md`'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- `artifacts/pilot/launch/latest.txt`'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- `artifacts/pilot/packages/aether-pilot-service-windows-x86_64.zip`'
